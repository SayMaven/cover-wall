name: Release Multi-OS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match "^v(.+)$") { $v = $Matches[1] } else { $v = "0.1.0" }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null
          Copy-Item target/release/cover-wall.exe dist/portable/
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/cover-wall-${{ steps.ver.outputs.version }}-windows-x86_64-portable.zip" -Force

      - name: Build EXE Installer (NSIS)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
              choco install nsis -y
            }
            $env:PATH += ";C:\Program Files (x86)\NSIS"
          }
          makensis /DVERSION=${{ steps.ver.outputs.version }} packaging/windows/installer.nsi
          Move-Item "packaging/windows/cover-wall-${{ steps.ver.outputs.version }}-windows-x86_64-setup.exe" dist/

      - name: Install cargo-wix & Build MSI Installer
        shell: pwsh
        run: |
          if (-not (Get-Command candle -ErrorAction SilentlyContinue)) {
            $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if (-not $wixBin) {
              choco install wixtoolset -y
              $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            }
            if ($wixBin) { $env:PATH += ";$wixBin" }
          }
          if (-not (Get-Command cargo-wix -ErrorAction SilentlyContinue)) {
            cargo install cargo-wix --locked
          }
          cargo wix --nocapture --no-build -o "dist/cover-wall-${{ steps.ver.outputs.version }}-windows-x86_64.msi"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.msi

  build-macos:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="0.1.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create .app bundle & DMG
        run: |
          APP_DIR="dist/Cover Wall Studio.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/${{ matrix.target }}/release/cover-wall" "$APP_DIR/Contents/MacOS/cover-wall"
          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Cover Wall Studio</string>
            <key>CFBundleDisplayName</key><string>Cover Wall Studio</string>
            <key>CFBundleIdentifier</key><string>com.saymaven.cover-wall</string>
            <key>CFBundleVersion</key><string>${{ steps.ver.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.ver.outputs.version }}</string>
            <key>CFBundleExecutable</key><string>cover-wall</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "Cover Wall Studio" -srcfolder "$APP_DIR" -ov -format UDZO "dist/cover-wall-${{ steps.ver.outputs.version }}-macos-${{ matrix.target }}.dmg"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-artifacts
          path: dist/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="0.1.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package tar.gz & .deb
        run: |
          mkdir -p dist/portable
          cp target/release/cover-wall LICENSE-MIT LICENSE-APACHE README.md dist/portable/
          tar -czf "dist/cover-wall-${{ steps.ver.outputs.version }}-linux-x86_64.tar.gz" -C dist/portable .
          if ! command -v cargo-deb >/dev/null 2>&1; then
            cargo install cargo-deb --locked
          fi
          cargo deb --no-build -o "dist/cover-wall-${{ steps.ver.outputs.version }}-linux-amd64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.tar.gz
            dist/*.deb

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Cover Wall Studio `${{ github.ref_name }}`

            A 100% pure Rust desktop studio for extracting album artwork from FLAC collections and composing 4K (`16:9` & `9:16`) mosaic wallpapers.

            ### Downloads

            | Platform | Architecture | Package |
            | --- | --- | --- |
            | **Windows** | x86_64 | `*-windows-x86_64.msi` (MSI Installer) |
            | **Windows** | x86_64 | `*-windows-x86_64-setup.exe` (NSIS Installer) |
            | **Windows** | x86_64 | `*-windows-x86_64-portable.zip` (Portable) |
            | **macOS** | Apple Silicon | `*-macos-aarch64-apple-darwin.dmg` |
            | **macOS** | Intel | `*-macos-x86_64-apple-darwin.dmg` |
            | **Linux** | amd64 / x86_64 | `*-linux-amd64.deb` (Debian/Ubuntu) |
            | **Linux** | x86_64 | `*-linux-x86_64.tar.gz` (Portable) |

            > Integrity checksums are provided in `SHA256SUMS.txt`.

            ---
          files: artifacts/*

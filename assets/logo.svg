<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- OKLCH Palette (H=260 obsidian-slate ramp + H=30 coral hero + H=200 cyan vinyl label) -->
  <defs>
    <clipPath id="frame-clip">
      <rect x="34" y="34" width="444" height="444" rx="92"/>
    </clipPath>
    <clipPath id="hero-sleeve-clip">
      <rect x="112" y="158" width="196" height="196" rx="18"/>
    </clipPath>
  </defs>

  <!-- Outer frame: oklch(0.145 0.014 260) / border: oklch(0.340 0.022 260) -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="#070A10" stroke="#313844" stroke-width="6"/>

  <!-- Clipped 12-degree diagonal sleeve wall -->
  <g clip-path="url(#frame-clip)">
    <rect x="34" y="34" width="444" height="444" fill="#070A10"/>

    <g transform="rotate(-12 256 256)">
      <!-- Surrounding album wall tiles (constant H=260, stepped L) -->
      <rect x="-20" y="-40" width="196" height="196" rx="18" fill="#151A22"/>
      <rect x="194" y="-40" width="196" height="196" rx="18" fill="#242A35"/>
      <rect x="408" y="-40" width="196" height="196" rx="18" fill="#151A22"/>

      <rect x="-102" y="174" width="196" height="196" rx="18" fill="#1D232D"/>
      <rect x="326" y="174" width="196" height="196" rx="18" fill="#1D232D"/>

      <rect x="-20" y="388" width="196" height="196" rx="18" fill="#151A22"/>
      <rect x="194" y="388" width="196" height="196" rx="18" fill="#2C333F"/>
      <rect x="408" y="388" width="196" height="196" rx="18" fill="#151A22"/>

      <!-- Subtle geometric accents on background sleeves -->
      <circle cx="292" cy="58" r="46" fill="#00C9D1" fill-opacity="0.20"/>
      <rect x="230" y="424" width="124" height="18" rx="9" fill="#E6EAF0" fill-opacity="0.14"/>

      <!-- Vinyl disc peeking out: oklch(0.100 0.008 260) + cyan label oklch(0.760 0.130 200) -->
      <circle cx="308" cy="256" r="88" fill="#020305" stroke="#242A35" stroke-width="4"/>
      <circle cx="308" cy="256" r="68" stroke="#151A22" stroke-width="2"/>
      <circle cx="308" cy="256" r="50" stroke="#151A22" stroke-width="2"/>
      <circle cx="308" cy="256" r="30" fill="#00C9D1"/>
      <circle cx="308" cy="256" r="9" fill="#070A10"/>

      <!-- Hero album sleeve: oklch(0.660 0.195 30) + crisp light oklch(0.935 0.010 260) -->
      <rect x="112" y="158" width="196" height="196" rx="18" fill="#F25643"/>
      <g clip-path="url(#hero-sleeve-clip)">
        <circle cx="112" cy="354" r="118" fill="#E6EAF0"/>
        <circle cx="256" cy="208" r="24" fill="#070A10"/>
        <rect x="136" y="188" width="64" height="10" rx="5" fill="#070A10"/>
        <rect x="136" y="208" width="40" height="10" rx="5" fill="#070A10" fill-opacity="0.65"/>
      </g>
    </g>
  </g>
</svg>

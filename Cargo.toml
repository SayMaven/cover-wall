[package]
name = "cover-wall"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure Rust album cover extractor and 4K wallpaper studio"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.31", default-features = true }
fast_image_resize = { version = "5.1", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
lofty = "0.22"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
resvg = { version = "0.45", default-features = false }
rfd = "0.15"
thiserror = "2.0"
walkdir = "2.5"

[lints.clippy]
all = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
